name: Docker image

# Post-merge only, not on every PR — building and pushing an image for every
# unmerged commit would spam the registry. Runs once dev→staging or
# staging→main actually lands.
on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The default builder (no explicit setup) uses the classic "docker"
      # driver, which supports `load: true` but not `cache-to`/`cache-from`.
      # docker-container driver supports both, which we need since we load
      # the image locally for Trivy before ever pushing it.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      # Build (and load locally) before pushing, so Trivy can scan the exact
      # image about to be pushed rather than trusting an unscanned push.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Must be a tag the image was actually loaded under (see the build
          # step above) — metadata-action's sha tag is "sha-<full-sha>", not
          # the bare sha, so it can't be reconstructed by hand here.
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - uses: github/codeql-action/upload-sarif@codeql-bundle-v2.27.0
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Only reached if Trivy passed. Pushes the exact image already built,
      # loaded, and scanned above via plain `docker push` — rebuilding here
      # instead (even with identical inputs/cache) would mean the image that
      # ships was never actually the one Trivy scanned. Labels are already
      # baked into the image from the build step, nothing to reapply here.
      - name: Push scanned image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$TAGS"
