name: Docker image

# Post-merge only, not on every PR — building and pushing an image for every
# unmerged commit would spam the registry. Runs once dev→staging or
# staging→main actually lands.
on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The default builder (no explicit setup) uses the classic "docker"
      # driver, which supports `load: true` but not `cache-to`/`cache-from`.
      # docker-container driver supports both, which we need since we load
      # the image locally for Trivy before ever pushing it.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      # Build (and load locally) before pushing, so Trivy can scan the exact
      # image about to be pushed rather than trusting an unscanned push.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db,ghcr.io/aquasecurity/trivy-java-db
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          scanners: vuln
          ignore-unfixed: true          # don't block on CVEs with no patch yet
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true         # don't fail if code scanning isn't enabled
        with:
          sarif_file: trivy-results.sarif

      - name: Push scanned image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$TAGS"
